name: Job Portal Docker CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    name: Build Docker Images, Run Tests & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t job-portal-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t job-portal-frontend .

      - name: Run Tests Inside Backend Docker Container
        run: docker run --rm job-portal-backend npm test

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Images to Container Registry
        if: github.event_name != 'pull_request'
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # Tag and push main repo container image
          docker tag job-portal-backend ghcr.io/${REPO_NAME}:${{ github.sha }}
          docker tag job-portal-backend ghcr.io/${REPO_NAME}:latest
          docker push ghcr.io/${REPO_NAME}:${{ github.sha }}
          docker push ghcr.io/${REPO_NAME}:latest

          # Tag and push backend component image
          docker tag job-portal-backend ghcr.io/${REPO_OWNER}/job-portal-backend:${{ github.sha }}
          docker tag job-portal-backend ghcr.io/${REPO_OWNER}/job-portal-backend:latest
          docker push ghcr.io/${REPO_OWNER}/job-portal-backend:${{ github.sha }}
          docker push ghcr.io/${REPO_OWNER}/job-portal-backend:latest

          # Tag and push frontend component image
          docker tag job-portal-frontend ghcr.io/${REPO_OWNER}/job-portal-frontend:${{ github.sha }}
          docker tag job-portal-frontend ghcr.io/${REPO_OWNER}/job-portal-frontend:latest
          docker push ghcr.io/${REPO_OWNER}/job-portal-frontend:${{ github.sha }}
          docker push ghcr.io/${REPO_OWNER}/job-portal-frontend:latest

